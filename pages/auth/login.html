<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - GharSe Marketplace</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>

    <header class="site-header">
        <div class="container header-inner">
            <a href="../../index.html" class="brand">
                <span class="brand-mark">G</span>
                <span class="brand-name">GharSe</span>
            </a>
        </div>
    </header>

    <main class="section">
        <div class="container" style="max-width: 440px;">
            <div class="metric-card">
                <h2 style="font-size: 1.8rem; margin-bottom: 8px;">Welcome back</h2>
                <p style="margin-bottom: 24px;">Log in to access your marketplace account.</p>

                <div id="authAlert" style="display: none; padding: 10px 14px; margin-bottom: 16px; border-radius: 8px; background: #fbeae8; color: var(--color-error); font-size: 0.88rem;"></div>

                <form id="loginForm">
                    <div class="form-group">
                        <label for="email" class="form-label">Email or phone</label>
                        <input type="text" id="email" class="form-control" required placeholder="name@example.com or phone">
                    </div>

                    <div class="form-group">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" id="password" class="form-control" required placeholder="••••••••">
                    </div>

                    <button type="submit" class="btn btn-primary btn-large" style="width: 100%; margin-top: 10px;">Log In</button>
                </form>

                <p style="margin-top: 20px; text-align: center; font-size: 0.9rem;">
                    Don't have an account? <a href="signup.html" class="text-link">Sign up</a>
                </p>
            </div>
        </div>
    </main>

    <script src="../../js/config.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/services/authService.js"></script>
    <script src="../../js/pages/auth/login.js"></script>
</body>
</html>
