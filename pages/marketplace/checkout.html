<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - GharSe</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <style>
        [hidden] { display: none !important; }
        .checkout-layout { display: grid; grid-template-columns: 1fr; gap: 24px; margin-top: 20px; }
        @media (min-width: 900px) { .checkout-layout { grid-template-columns: 2fr 1fr; } }
        .checkout-card { padding: 20px; border: 1px solid #e5e5e5; border-radius: 12px; display: flex; flex-direction: column; gap: 14px; }
        .checkout-card label { display: flex; gap: 8px; align-items: flex-start; }
        .checkout-summary-line { display: flex; justify-content: space-between; }
        .checkout-status { text-align: center; padding: 40px 20px; }
    </style>
</head>
<body>

    <header class="site-header">
        <div class="container header-inner">
            <a href="../../index.html" class="brand">
                <span class="brand-mark">G</span>
                <span class="brand-name">GharSe</span>
            </a>
            <nav class="main-nav" aria-label="Main navigation"></nav>
            <button class="mobile-menu-button" id="mobileMenuButton" type="button" aria-label="Open navigation menu" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <main class="section">
        <div class="container" id="checkoutContainer">
            <div class="state-box"><p>Loading checkout...</p></div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container footer-bottom">
            <span>© 2026 GharSe Marketplace</span>
        </div>
    </footer>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script src="../../js/config.js"></script>
    <script src="../../js/core/utils.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/services/cartService.js"></script>
    <script src="../../js/services/checkoutService.js"></script>
    <script src="../../js/toast.js"></script>
    <script src="../../js/nav.js"></script>
    <script src="../../js/pages/marketplace/checkout.js"></script>

</body>
</html>
