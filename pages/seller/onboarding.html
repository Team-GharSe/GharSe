<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set up your store - GharSe Marketplace</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <style>
        [hidden] { display: none !important; }
    </style>
</head>
<body>

    <header class="site-header">
        <div class="container header-inner">
            <a href="../../index.html" class="brand">
                <span class="brand-mark">G</span>
                <span class="brand-name">GharSe</span>
            </a>
        </div>
    </header>

    <main class="section">
        <div class="container" style="max-width: 560px;">
            <div class="metric-card">
                <p id="stepLabel" style="font-size: 0.85rem; color: var(--color-text-muted);">Step 1 of 3</p>
                <h2 style="font-size: 1.6rem; margin: 6px 0 20px;">Set up your store</h2>

                <div id="formAlert" class="form-error" style="display: none; margin-bottom: 16px;"></div>

                <section data-step="1">
                    <div class="form-group">
                        <label for="businessName" class="form-label">Business or studio name</label>
                        <input type="text" id="businessName" class="form-control" maxlength="150" placeholder="Anita's Handloom Studio">
                        <small>This is how buyers will see your store.</small>
                    </div>
                </section>

                <section data-step="2" hidden>
                    <p style="margin-bottom: 12px;">Buyers see how far away you are. Share your location once, or type the coordinates.</p>
                    <button type="button" id="useLocationBtn" class="btn btn-secondary btn-large" style="width: 100%; margin-bottom: 16px;">Use my current location</button>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                        <div class="form-group">
                            <label for="latitude" class="form-label">Latitude</label>
                            <input type="number" id="latitude" class="form-control" step="any" placeholder="19.0760">
                        </div>
                        <div class="form-group">
                            <label for="longitude" class="form-label">Longitude</label>
                            <input type="number" id="longitude" class="form-control" step="any" placeholder="72.8777">
                        </div>
                    </div>
                    <p id="locationStatus" style="font-size: 0.85rem;"></p>
                </section>

                <section data-step="3" hidden>
                    <p style="margin-bottom: 12px;">Check your details before creating your store.</p>
                    <p>Store name: <strong id="reviewName"></strong></p>
                    <p>Latitude: <strong id="reviewLat"></strong></p>
                    <p>Longitude: <strong id="reviewLng"></strong></p>
                </section>

                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button type="button" id="backBtn" class="btn btn-secondary" style="flex: 1;" hidden>Back</button>
                    <button type="button" id="nextBtn" class="btn btn-primary btn-large" style="flex: 2;">Continue</button>
                </div>
            </div>
        </div>
    </main>

    <script src="../../js/config.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/geo.js"></script>
    <script src="../../js/toast.js"></script>
    <script src="../../js/pages/seller/onboarding.js"></script>
</body>
</html>
