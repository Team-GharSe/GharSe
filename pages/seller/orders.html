<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incoming Orders - Artisan Studio</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <style>
        [hidden] { display: none !important; }
        .order-card { padding: 20px; margin-bottom: 16px; }
        .order-head { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
        .order-items { margin: 12px 0; padding-left: 18px; }
        .order-actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    </style>
</head>
<body>

    <header class="site-header">
        <div class="container header-inner">
            <a href="../../index.html" class="brand">
                <span class="brand-mark">A</span>
                <span class="brand-name">Artisan Studio</span>
            </a>
            <nav class="main-nav" aria-label="Main navigation"></nav>
            <button class="mobile-menu-button" id="mobileMenuButton" type="button" aria-label="Open navigation menu" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <main class="section">
        <div class="container">
            <div class="section-heading">
                <span class="eyebrow">Seller workspace</span>
                <h2>Incoming orders</h2>
            </div>

            <div class="filter-row">
                <label for="statusFilter" class="sr-only">Filter by status</label>
                <select id="statusFilter" class="form-control">
                    <option value="">All statuses</option>
                    <option value="CONFIRMED">Confirmed</option>
                    <option value="IN_PRODUCTION">In production</option>
                    <option value="READY">Ready</option>
                    <option value="OUT_FOR_DELIVERY">Out for delivery</option>
                    <option value="DELIVERED">Delivered</option>
                </select>
                <button type="button" id="refreshOrders" class="btn btn-secondary">Refresh</button>
            </div>

            <p id="pageAlert" class="form-error" role="alert" hidden></p>
            <p id="ordersSummary" class="results-summary" aria-live="polite"></p>

            <div id="ordersList" aria-busy="true">
                <div class="state-box"><p>Loading orders...</p></div>
            </div>
        </div>
    </main>

    <script src="../../js/config.js"></script>
    <script src="../../js/core/utils.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/toast.js"></script>
    <script src="../../js/nav.js"></script>
    <script src="../../js/core/app.js"></script>
    <script src="../../js/pages/seller/orders.js"></script>
</body>
</html>
