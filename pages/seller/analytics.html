<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics - Artisan Studio</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <style>
        [hidden] { display: none !important; }
        .analytics-filter { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; margin: 20px 0; }
        .analytics-filter label { display: grid; gap: 4px; font-weight: 600; font-size: 0.9rem; }
        .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin-bottom: 24px; }
        .stat-card { padding: 16px; border-radius: 10px; background: #f7f4ef; }
        .stat-card .stat-label { font-size: 0.85rem; color: var(--color-text-muted, #6b6b6b); }
        .stat-card .stat-value { font-size: 1.5rem; font-weight: 700; margin-top: 4px; }
        .analytics-table { width: 100%; border-collapse: collapse; }
        .analytics-table th, .analytics-table td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #e6e1d8; }
        .analytics-table td.num, .analytics-table th.num { text-align: right; }
        .form-alert { margin-top: 16px; padding: 12px 14px; border-radius: 8px; background: #fdecea; color: #7a1d14; }
        .muted { color: var(--color-text-muted, #6b6b6b); }
    </style>
</head>
<body>

    <header class="site-header">
        <div class="container header-inner">
            <a href="dashboard.html" class="brand">
                <span class="brand-mark">A</span>
                <span class="brand-name">Artisan Studio</span>
            </a>
            <nav class="main-nav" aria-label="Main navigation"></nav>
        </div>
    </header>

    <main class="section">
        <div class="container">
            <a href="dashboard.html" class="text-link back-link">&larr; Back to dashboard</a>
            <h1 style="font-size: 1.8rem; margin-top: 12px;">Analytics</h1>
            <p class="muted">How your shop is doing. Figures include every order placed in the selected dates.</p>

            <div id="pageAlert" class="form-alert" role="alert" hidden></div>

            <form id="rangeForm" class="analytics-filter">
                <label>From
                    <input type="date" id="fromDate" class="form-control" required>
                </label>
                <label>To
                    <input type="date" id="toDate" class="form-control" required>
                </label>
                <button type="submit" class="btn btn-primary">Show</button>
                <button type="button" id="exportBtn" class="btn btn-secondary" disabled>Export CSV</button>
            </form>

            <div class="stat-grid">
                <div class="stat-card">
                    <div class="stat-label">Revenue</div>
                    <div class="stat-value" id="statRevenue">&mdash;</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Orders</div>
                    <div class="stat-value" id="statOrders">&mdash;</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Units sold</div>
                    <div class="stat-value" id="statUnits">&mdash;</div>
                </div>
            </div>

            <h2 style="font-size: 1.2rem;">Daily breakdown</h2>
            <p id="emptyNote" class="muted" hidden>No orders in this period.</p>
            <table class="analytics-table" id="dailyTable" hidden>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th class="num">Orders</th>
                        <th class="num">Revenue</th>
                    </tr>
                </thead>
                <tbody id="dailyBody"></tbody>
            </table>
        </div>
    </main>

    <script src="../../js/config.js"></script>
    <script src="../../js/core/utils.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/toast.js"></script>
    <script src="../../js/nav.js"></script>
    <script src="../../js/pages/seller/seller-guard.js"></script>
    <script src="../../js/pages/seller/analytics.js"></script>
</body>
</html>
