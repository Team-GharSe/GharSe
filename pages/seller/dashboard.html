<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Dashboard - Artisan</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <style>
        [hidden] { display: none !important; }
    </style>
</head>
<body>

    <header class="site-header">
        <div class="container header-inner">
            <a href="../../index.html" class="brand">
                <span class="brand-mark">A</span>
                <span class="brand-name">Artisan Studio</span>
            </a>
            <nav class="main-nav" aria-label="Main navigation"></nav>
            <button class="mobile-menu-button" id="mobileMenuButton" type="button" aria-label="Open navigation menu" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <main class="section">
        <div class="container">
            <h2 id="storeName">Seller Workspace</h2>
            <p id="storeLocation" style="margin-bottom: 24px; color: var(--color-text-muted);"></p>

            <div id="pageAlert" class="form-error" hidden style="margin-bottom: 16px;"></div>

            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px;">
                <div class="metric-card">
                    <span style="font-size: 0.85rem; color: var(--color-text-muted);">Total Revenue</span>
                    <h3 style="font-size: 1.8rem; margin-top: 6px; color: var(--color-primary);">—</h3>
                </div>
                <div class="metric-card">
                    <span style="font-size: 0.85rem; color: var(--color-text-muted);">Units Sold</span>
                    <h3 style="font-size: 1.8rem; margin-top: 6px;">—</h3>
                </div>
                <div class="metric-card">
                    <span style="font-size: 0.85rem; color: var(--color-text-muted);">Active Products</span>
                    <h3 style="font-size: 1.8rem; margin-top: 6px;">—</h3>
                </div>
            </div>

            <div class="metric-card">
                <h3 style="margin-bottom: 8px;">Recent Sales</h3>
                <p style="color: var(--color-text-muted);">Sales appear here once orders are live.</p>
            </div>
        </div>
    </main>

    <script src="../../js/config.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/nav.js"></script>
    <script src="../../js/core/app.js"></script>
    <script src="../../js/pages/seller/dashboard.js"></script>
</body>
</html>
