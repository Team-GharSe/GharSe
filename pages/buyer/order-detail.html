<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order details - Artisan</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <style>
        [hidden] { display: none !important; }
        .detail-wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
        .detail-card { padding: 20px; border: 1px solid #e5e5e5; border-radius: 12px; }
        .tracker { display: flex; justify-content: space-between; gap: 6px; list-style: none; padding: 0; margin: 12px 0 0; flex-wrap: wrap; }
        .tracker li { flex: 1; min-width: 110px; text-align: center; font-size: 0.8rem; color: var(--color-text-muted); padding-top: 26px; position: relative; }
        .tracker li::before { content: ""; position: absolute; top: 6px; left: 50%; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: #d9d9d9; }
        .tracker li.done { color: var(--color-text, #222); font-weight: 600; }
        .tracker li.done::before { background: #2f6f5e; }
        .tracker li.current::before { background: #2f6f5e; box-shadow: 0 0 0 4px rgba(47,111,94,0.2); }
        .review-item { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; padding: 12px 0; border-bottom: 1px solid #eee; }
        .review-form { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
        .review-form .stars { display: flex; gap: 6px; }
        .review-form .stars button { font-size: 1.6rem; background: none; border: none; cursor: pointer; color: #bbb; padding: 0 2px; }
        .review-form .stars button.on { color: #e0a800; }
        .review-done { color: #2f6f5e; font-weight: 600; }
    </style>
</head>
<body>

    <header class="site-header">
        <div class="container header-inner">
            <a href="../../index.html" class="brand">
                <span class="brand-mark">A</span>
                <span class="brand-name">Artisan</span>
            </a>
            <nav class="main-nav" aria-label="Main navigation"></nav>
            <button class="mobile-menu-button" id="mobileMenuButton" type="button" aria-label="Open navigation menu" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <main class="section">
        <div class="container detail-wrap" id="orderContainer">
            <div class="state-box"><p>Loading order...</p></div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container footer-bottom">
            <span>© 2026 Artisan Marketplace</span>
        </div>
    </footer>

    <script src="../../js/config.js"></script>
    <script src="../../js/core/utils.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/services/orderService.js"></script>
    <script src="../../js/services/reviewService.js"></script>
    <script src="../../js/toast.js"></script>
    <script src="../../js/nav.js"></script>
    <script src="../../js/pages/buyer/order-detail.js"></script>

</body>
</html>
