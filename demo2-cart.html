<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GharSe demo v2: basket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Caveat:wght@700&family=DM+Mono:wght@400;500&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="demo2.css">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/MotionPathPlugin.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/Flip.min.js"></script>
  <script defer src="demo2.js"></script>
</head>
<body data-page="cart" data-theme="sand">

<div class="page">
  <header data-chrome="header"></header>

  <main>
    <!-- Quiet intensity: money screen. Same palette and type, almost no decoration. -->
    <section class="receipt-wrap">
      <div class="receipt">
        <h1>Your basket</h1>
        <p class="receipt__lock">All from <b>Meena's Kitchen</b>, Andheri &middot; one maker per order</p>
        <hr>
        <div id="lines"></div>
        <hr>
        <div class="modes" role="group" aria-label="How do you want it?">
          <button class="chip" type="button" data-mode="delivery" aria-pressed="true">Deliver to me</button>
          <button class="chip" type="button" data-mode="pickup" aria-pressed="false">I'll pick up</button>
        </div>
        <hr>
        <div class="sum">
          <span>Subtotal</span><span id="sub">₹0</span>
          <span>Delivery</span><span id="fee">₹0</span>
          <span class="total">Total</span><span class="total" id="total">₹0</span>
        </div>
        <button class="btn" id="pay" type="button">Place order (demo)</button>
        <p class="receipt__fine">Demo only. In the real app the server computes every price and total, and Razorpay opens from here.</p>
      </div>
    </section>
  </main>
</div>

<div class="placed" aria-hidden="true"><span>ORDER PLACED</span></div>

<footer data-chrome="footer"></footer>

</body>
</html>
